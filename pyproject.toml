[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihoyo-toolkit"
version = "3.0.0"
description = "米游社工具箱 - 米游社 / 微博 / 米哈游四站点新闻数据抓取与提取工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LingLan" }]
keywords = ["miyoushe", "mihoyo", "hoyoverse", "scraper", "playwright", "genshin", "zzz", "starrail"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "tqdm>=4.65.0",
    "playwright>=1.40.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
pinyin = ["pypinyin>=0.49.0"]
excel = ["openpyxl>=3.1.0"]
icon = ["Pillow>=10.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
mihoyo-toolkit = "mihoyo_toolkit.__main__:main"

[project.gui-scripts]
mihoyo-toolkit-gui = "mihoyo_toolkit.__main__:gui_main"

[project.urls]
Homepage = "https://github.com/vers123/mihoyo-tool-kit"
Changelog = "https://github.com/vers123/mihoyo-tool-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/vers123/mihoyo-tool-kit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mihoyo_toolkit = ["py.typed"]

# ============================================================
#  ruff —— lint + format（替代 flake8）
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "build", "dist", "browser", "data", "logs", "har", "resources"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line-too-long（由 formatter 负责）
    "B008",  # 函数调用作为默认参数（Qt/依赖注入常见）
    "N802",  # 允许 Qt 方法的驼峰命名
    "N803",
    "N806",
    "RUF001",  # 中文全角标点（项目为中文界面，保留全角）
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ 按语义分组并注释，不做字母排序
    "N818",    # RetryExhausted 已是明确语义，不强制 Error 后缀
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "N803"]
"src/mihoyo_toolkit/gui/**" = ["N802", "N803", "N806"]
"src/mihoyo_toolkit/core/models.py" = ["N815"]  # 字段沿用米哈游 API 原始命名

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
#  mypy —— 渐进式类型检查
# ============================================================
[tool.mypy]
python_version = "3.11"
files = ["src/mihoyo_toolkit"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["playwright.*", "PySide6.*", "pypinyin.*", "openpyxl.*", "PIL.*"]
ignore_missing_imports = true

# ============================================================
#  pytest + coverage
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 单元测试（无外部依赖）",
    "integration: 集成测试（本地 IO / SQLite）",
    "e2e: 端到端测试（网络 / 浏览器，默认跳过）",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/mihoyo_toolkit"]
branch = true
omit = [
    "*/gui/*",
    "*/__main__.py",
]

[tool.coverage.report]
# 覆盖率门槛：唯一生效位置（此前 .coveragerc 以 35% 覆盖了本文件，已合并删除）
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
