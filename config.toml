# ============================================================
#  米游社工具箱 v3.1.1 配置文件
#  由 pydantic-settings 加载，支持环境变量覆盖（前缀 MIHOYO_）
#  例：MIHOYO_FETCH__HEADLESS=false
# ============================================================

[app]
# 运行模式：cli（交互菜单）| gui（图形界面）
mode = "cli"
version = "3.1.1"

[fetch]
# 浏览器是否后台运行（无头）
headless = true
# 页面加载额外等待秒数
wait_seconds = 3
# 超时（毫秒）
timeout = 120000
# 虚拟滚动最大尝试次数
max_scroll_attempts = 500
# 滚动间隔（秒）
scroll_delay = 2.0
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
browser_args = ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"]

[retry]
max_attempts = 3
delay = 2.0

[incremental]
enabled = true
# 遇到已存在数据提前终止
stop_on_existing = true
# 新数据与本地历史合并去重
merge_data = true

[backup]
enabled = true
max_backups = 10

[cookies]
# 从 Firefox cookies.sqlite 读取并注入（免登录）
use_firefox = true

[har]
# 浏览器回退抓取时自动录制 API 的 HAR（仅对 user/weibo/新闻等有 API 拦截的抓取器生效）
auto_update = true
# 每个抓取器保留的自动录制 HAR 文件数量（手动导出的 HAR 不受影响）
max_files = 3

# ============================================================
#  米游社用户
# ============================================================
[sources.user]
# 替换为你要抓取的米游社用户 UID（默认值为原神官方账号）；也可不改此文件，用环境变量覆盖：
#   MIHOYO_SOURCES__USER__URL="https://www.miyoushe.com/ys/accountCenter/postList?id=<UID>"
url = "https://www.miyoushe.com/ys/accountCenter/postList?id=75276539"

# ============================================================
#  角色图鉴
# ============================================================
