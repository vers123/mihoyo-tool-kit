name: Bug 报告
description: 报告一个程序错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量详细描述问题。
        提交前建议先运行 `mihoyo-toolkit --version` 确认版本。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: |
        1. 运行 'mihoyo-toolkit --fetch all'
        2. 观察到 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 14 / Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 3.11.4
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 工具箱版本
      description: 运行 `mihoyo-toolkit --version` 的输出
      placeholder: 2.0.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 粘贴相关日志或错误信息（可参考 `logs/console.log` / `logs/app.log`）
      render: shell
