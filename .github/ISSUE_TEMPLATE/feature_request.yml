name: 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题，或希望改进什么
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何实现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案（可选）

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      description: 该功能大致涉及哪个部分（可参考 docs/architecture.md）
      options:
        - 抓取（scrapers）
        - 提取（extractors）
        - 导出（exporters）
        - CLI（cli）
        - GUI（gui）
        - 配置 / 存储（core）
        - 构建 / CI / 文档
        - 其他

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他相关上下文、截图等
